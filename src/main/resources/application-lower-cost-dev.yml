# Explicit DEV-only application TLS; the ordinary local profile is unchanged.
# Validated inline SSL bundles are installed by InjectedCredentials before context refresh.
server:
  address: 0.0.0.0
  port: 8443
  ssl:
    enabled: true
    bundle: serving
    enabled-protocols: TLSv1.3,TLSv1.2
    client-auth: need
management:
  server:
    port: 8081
    address: 127.0.0.1
    ssl:
      enabled: false
# DLV-969 (owner, 2026-11-04): one tidy JSON record per log line in CloudWatch, the same template in Domain and Gateway.
# A stack trace stays inside its record (cause first, repeated frames folded) instead of one CloudWatch event per line.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: domain
        environment: ${LOOKAHEAD_ENVIRONMENT:dev}
    json:
      stacktrace:
        root: first
        include-common-frames: false
        max-length: 20000
