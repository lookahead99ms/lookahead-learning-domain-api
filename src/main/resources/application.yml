spring:
  application:
    name: lookahead-learning-domain-api
  profiles:
    include: accounts,resource
  config:
    import: optional:configtree:${LOOKAHEAD_SECRETS_DIRECTORY:/run/secrets/}
  flyway:
    enabled: false
  datasource:
    url: ${LOOKAHEAD_DOMAIN_JDBC_URL}
    password: ${LOOKAHEAD_DOMAIN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 6
      connection-timeout: 3000
      validation-timeout: 2000
  mail:
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  address: ${LOOKAHEAD_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: none
  shutdown: graceful
app:
  author-reviews:
    manifest: ${LOOKAHEAD_AUTHOR_REVIEW_MANIFEST:}
  version: "@project.version@"
  deployment-environment: ${LOOKAHEAD_ENVIRONMENT}
  identity:
    issuer: ${LOOKAHEAD_OAUTH_ISSUER:}
    upstream: ${LOOKAHEAD_IDENTITY_UPSTREAM:}
    gateway-client-id: ${APP_OAUTH_CLIENT_ID:lookahead-web-gateway}
    verifier-secret: ${LOOKAHEAD_IDENTITY_VERIFIER_SECRET:}
  cognito:
    issuer: ${LOOKAHEAD_COGNITO_ISSUER:}
    region: ${AWS_REGION:}
    client-id: ${APP_OAUTH_CLIENT_ID:}
    scope-prefix: ${LOOKAHEAD_COGNITO_SCOPE_PREFIX:}
    gateway-secret: ${LOOKAHEAD_DOMAIN_GATEWAY_SECRET:}
  accounts:
    catalog-path: ${LOOKAHEAD_ACCOUNT_CATALOG:}
  content:
    publication-path: ${LOOKAHEAD_CONTENT_PUBLICATION:}
    root: ${LOOKAHEAD_CONTENT_ROOT:}
  publication:
    region: ${AWS_REGION:}
    account-id: ${LOOKAHEAD_AWS_ACCOUNT_ID:}
    bucket: ${LOOKAHEAD_PUBLICATION_BUCKET:}
    release-id: ${LOOKAHEAD_PUBLICATION_RELEASE_ID:}
    manifest-sha256: ${LOOKAHEAD_PUBLICATION_MANIFEST_SHA256:}
    archive-sha256: ${LOOKAHEAD_PUBLICATION_ARCHIVE_SHA256:}
    directory: ${LOOKAHEAD_PUBLICATION_DIRECTORY:/tmp/lookahead-publications}
    cache-bytes: ${LOOKAHEAD_CONTENT_CACHE_BYTES:33554432}
    cache-entries: ${LOOKAHEAD_CONTENT_CACHE_ENTRIES:256}
  cors:
    allowed-origins: []
  local-test:
    seed-enabled: ${LOOKAHEAD_DOMAIN_SEED_ENABLED:false}
    author-enabled: ${LOOKAHEAD_DOMAIN_AUTHOR_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,domainDatabase,contentPublication
