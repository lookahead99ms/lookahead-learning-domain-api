spring:
  application:
    name: lookahead-learning-domain-api
  profiles:
    include: accounts,resource
  config:
    import: optional:configtree:${LOOKAHEAD_SECRETS_DIRECTORY:/run/secrets/}
  servlet:
    # DLV-928 platform review uploads: 6 images of at most 5 MB, 20 MB of images per item.
    multipart:
      max-file-size: 5MB
      max-request-size: 21MB
      file-size-threshold: 6MB
  mail:
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
# Plain logs (owner, 2026-11-17): every line is "<UTC timestamp with millis> <LEVEL padded to 5> <sentence>", followed by
# two spaces and "[request <first 8 chars of the request id>]" only while a request is being served (MDC requestId); a
# stack trace follows the line only for ERROR lines of the unexpected-failure handlers. No logger name, thread, PID or
# service name; the same pattern in every profile. The %replace drops the bracket when the MDC value is empty, so a line
# outside a request ends after the sentence with no trailing spaces. EventLogPlainLoggingTest renders this very pattern.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z', UTC} %-5level %msg%replace(  [request %.-8X{requestId}]){'  \\[request \\]$', ''}%n%ex"
server:
  address: ${LOOKAHEAD_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: none
  shutdown: graceful
app:
  platform-reviews:
    # Local volume or explicitly configured cloud S3; absent configuration answers 503.
    directory: ${LOOKAHEAD_PLATFORM_REVIEW_DIRECTORY:}
    # DLV-968: the DEV task definition sets LOOKAHEAD_PLATFORM_REVIEWS_*; the singular names remain for local use.
    bucket: ${LOOKAHEAD_PLATFORM_REVIEWS_BUCKET:${LOOKAHEAD_PLATFORM_REVIEW_BUCKET:}}
    prefix: ${LOOKAHEAD_PLATFORM_REVIEWS_PREFIX:${LOOKAHEAD_PLATFORM_REVIEW_PREFIX:}}
    kms-key: ${LOOKAHEAD_PLATFORM_REVIEWS_KMS_KEY:${LOOKAHEAD_PLATFORM_REVIEW_KMS_KEY:}}
    # DLV-971: the retired day-file prefix (DEV platform-reviews/), read once at start to import its items into the
    # record stores below; empty skips the import. Never written or deleted by the Domain. "prefix" above is no longer
    # read for records; the DEV task definition still passes it.
    # Interim reviewer list (account usernames, comma separated) until roles are managed in the admin pages.
    reviewers: ${LOOKAHEAD_PLATFORM_REVIEWERS:}
  # DLV-971 (owner, 2026-11-06): runtime stores in the assets bucket, one root each (records/YYYY/MM/DD/<ID>.json and
  # attachments/<ID>/ under reviews/ and support-requests/; plan.json, inbox/plan.json and archive/ under delivery/).
  # Local keeps the same roots as sub-folders of app.platform-reviews.directory.
  reviews:
    prefix: ${LOOKAHEAD_REVIEWS_PREFIX:reviews/}
  support-requests:
    prefix: ${LOOKAHEAD_SUPPORT_REQUESTS_PREFIX:support-requests/}
  delivery:
    prefix: ${LOOKAHEAD_DELIVERY_PREFIX:delivery/}
  author-reviews:
    manifest: ${LOOKAHEAD_AUTHOR_REVIEW_MANIFEST:}
  version: "@project.version@"
  deployment-environment: ${LOOKAHEAD_ENVIRONMENT}
  # DLV-970: DynamoDB is the one store of this process (PostgreSQL served DEV until 2026-11-17 and was retired).
  dynamodb:
    region: ${AWS_REGION:}
    # Local only: the loopback DynamoDB Local endpoint, e.g. http://127.0.0.1:4400. Must be empty in dev and prod.
    endpoint: ${LOOKAHEAD_DYNAMODB_ENDPOINT:}
    # dev/prod: the four approved literal names; Local reuses the dev names on its own container.
    user-account-details-table-name: ${LOOKAHEAD_DYNAMODB_USER_ACCOUNT_DETAILS_TABLE:}
    administrator-audit-events-table-name: ${LOOKAHEAD_DYNAMODB_ADMINISTRATOR_AUDIT_EVENTS_TABLE:}
    user-study-plan-details-table-name: ${LOOKAHEAD_DYNAMODB_USER_STUDY_PLAN_DETAILS_TABLE:}
    protected-owner-identity-table-name: ${LOOKAHEAD_DYNAMODB_PROTECTED_OWNER_IDENTITY_TABLE:}
  identity:
    issuer: ${LOOKAHEAD_OAUTH_ISSUER:}
    upstream: ${LOOKAHEAD_IDENTITY_UPSTREAM:}
    gateway-client-id: ${APP_OAUTH_CLIENT_ID:lookahead-web-gateway}
    verifier-secret: ${LOOKAHEAD_IDENTITY_VERIFIER_SECRET:}
  cognito:
    issuer: ${LOOKAHEAD_COGNITO_ISSUER:}
    region: ${AWS_REGION:}
    client-id: ${APP_OAUTH_CLIENT_ID:}
    scope-prefix: ${LOOKAHEAD_COGNITO_SCOPE_PREFIX:}
    gateway-secret: ${LOOKAHEAD_DOMAIN_GATEWAY_SECRET:}
  # DLV-969 S36: the merge link is <public-url>/account/merge?token=…; off (the default) only logs a skipped email.
  # Unset: https://dev.devlookahead.com in dev; elsewhere startup fails when the email is enabled (AccountMergeConfiguration).
  public-url: ${LOOKAHEAD_PUBLIC_URL:}
  email:
    enabled: ${LOOKAHEAD_EMAIL_ENABLED:false}
    # Required when enabled, no default: an address, or a name and <address> ("Look Ahead <no-reply@…>").
    from: ${LOOKAHEAD_EMAIL_FROM:}
    region: ${AWS_REGION:}
  accounts:
    catalog-path: ${LOOKAHEAD_ACCOUNT_CATALOG:}
  content:
    publication-path: ${LOOKAHEAD_CONTENT_PUBLICATION:}
    root: ${LOOKAHEAD_CONTENT_ROOT:}
  publication:
    region: ${AWS_REGION:}
    account-id: ${LOOKAHEAD_AWS_ACCOUNT_ID:}
    bucket: ${LOOKAHEAD_PUBLICATION_BUCKET:}
    release-id: ${LOOKAHEAD_PUBLICATION_RELEASE_ID:}
    manifest-sha256: ${LOOKAHEAD_PUBLICATION_MANIFEST_SHA256:}
    archive-sha256: ${LOOKAHEAD_PUBLICATION_ARCHIVE_SHA256:}
    directory: ${LOOKAHEAD_PUBLICATION_DIRECTORY:/tmp/lookahead-publications}
    # DLV-971: the approved layout serves one publication tar from release/live/ (exactly one v*.tar). Empty keeps
    # today's live/<tag>/ discovery until the AWS lane cuts over; DEV then sets release/live/.
    live-prefix: ${LOOKAHEAD_PUBLICATION_LIVE_PREFIX:}
    cache-bytes: ${LOOKAHEAD_CONTENT_CACHE_BYTES:33554432}
    cache-entries: ${LOOKAHEAD_CONTENT_CACHE_ENTRIES:256}
  cors:
    allowed-origins: []
  test-accounts:
    # DLV-969 S35: local (default) keeps the Local fixture roster; dev (DEV only) keeps database-only test accounts
    # that staff use through test sessions inside the DEV gate.
    identity: ${LOOKAHEAD_TEST_ACCOUNT_IDENTITY:local}
  local-test:
    seed-enabled: ${LOOKAHEAD_DOMAIN_SEED_ENABLED:false}
    author-enabled: ${LOOKAHEAD_DOMAIN_AUTHOR_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,dynamodb,contentPublication
