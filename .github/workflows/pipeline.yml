{
  "name": "Merge-driven DEV pipeline",
  "run-name": "${{ github.workflow }} | ${{ github.event_name }} | ${{ github.ref_name }} | #${{ github.run_number }}",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "dev-pipeline-${{ github.repository }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "tag": {
      "name": "Cut the calendar release tag at this main commit",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "write"
      },
      "outputs": {
        "release-version": "${{ steps.cut.outputs.release_version }}",
        "source-sha": "${{ steps.cut.outputs.source_sha }}"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "name": "Checkout trusted release tooling from main",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Refuse any run that is not on main",
          "run": "test \"$GITHUB_REF\" = refs/heads/main"
        },
        {
          "name": "Cut the next release tag at the run commit, or reuse the one that already names it",
          "id": "cut",
          "run": "python3 tools/release/pipeline_tag.py cut --app domain --record \"$RUNNER_TEMP/release-tag.json\""
        },
        {
          "name": "Retain the release-tag record",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "release-tag",
            "path": "${{ runner.temp }}/release-tag.json",
            "if-no-files-found": "error",
            "retention-days": 21
          }
        }
      ]
    },
    "build-scan-publish": {
      "name": "Build, scan and publish the tagged DEV image (approval gate inside)",
      "needs": "tag",
      "permissions": {
        "contents": "read",
        "actions": "read",
        "id-token": "write",
        "issues": "write",
        "pull-requests": "read"
      },
      "uses": "./.github/workflows/release-image.yml",
      "with": {
        "role-arn": "${{ vars.DEV_PUBLISH_ROLE_ARN || 'arn:aws:iam::509614632283:role/lookahead-dev-deploy' }}",
        "ecr-repository": "509614632283.dkr.ecr.us-east-2.amazonaws.com/lookahead-dev-ecr",
        "release-version": "${{ needs.tag.outputs.release-version }}"
      }
    },
    "deploy-dev": {
      "name": "Request the DEV deployment (held until DEV_DEPLOY_ENABLED=true)",
      "needs": [
        "tag",
        "build-scan-publish"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "RELEASE_VERSION": "${{ needs.tag.outputs.release-version }}",
        "DEV_DEPLOY_ENABLED": "${{ vars.DEV_DEPLOY_ENABLED }}",
        "INFRA_DISPATCH_TOKEN": "${{ secrets.INFRA_DISPATCH_TOKEN }}"
      },
      "steps": [
        {
          "name": "Checkout trusted release tooling from main",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Hold, or request the DEV deployment through Infra application-deploy.yml",
          "run": "python3 tools/release/pipeline_tag.py deploy-request --app domain"
        }
      ]
    },
    "deploy-prod": {
      "name": "PROD (dummy stage)",
      "needs": "deploy-dev",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {},
      "steps": [
        {
          "name": "No PROD environment yet",
          "run": "echo \"no PROD environment yet; runs once PROD is configured\""
        }
      ]
    }
  }
}
