{
  "name": "03 · Publish",
  "run-name": "${{ github.workflow }} | ${{ github.ref_name }} | ${{ github.event_name }} | #${{ github.run_number }}",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write",
    "actions": "read",
    "issues": "write",
    "pull-requests": "read",
    "id-token": "write"
  },
  "jobs": {
    "release": {
      "uses": "./.github/workflows/release.yml",
      "with": {
        "action": "publish"
      },
      "secrets": "inherit"
    }
  }
}
