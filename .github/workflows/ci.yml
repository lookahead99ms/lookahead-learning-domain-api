{
  "name": "Domain API CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {},
    "workflow_call": {
      "inputs": {
        "export-image": {
          "type": "boolean",
          "default": false
        },
        "release-version": {
          "type": "string",
          "default": ""
        },
        "source-sha": {
          "type": "string",
          "required": false,
          "default": "",
          "description": "Tag-resolved application commit to build; empty builds the triggering commit"
        }
      },
      "secrets": {
        "CONTENT_READ_TOKEN": {
          "required": false,
          "description": "Read-only token for the Content repository's contracts/ (Contents: read); a calling workflow passes it with secrets: inherit"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "lookahead-learning-domain-api-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 55,
      "steps": [
        {
          "name": "Checkout the selected source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.source-sha || github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Fetch the executed workflow commit for image binding",
          "if": "inputs.export-image == true",
          "run": "git fetch origin \"$GITHUB_SHA\""
        },
        {
          "name": "Verify release tag before building",
          "if": "inputs.export-image == true",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .github/pipeline/shared/release_version.py check --app domain"
        },
        {
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "21",
            "cache": "maven"
          }
        },
        {
          "name": "Test Maven bootstrap retry, fallback and checksum protection",
          "run": "python3 -m unittest discover -s .github/pipeline/build -p 'test_maven_wrapper.py'"
        },
        {
          "name": "Test security gates with clean, finding and incomplete fixtures",
          "run": "python3 -m unittest discover -s .github/pipeline/build -p 'test_checks.py'"
        },
        {
          "name": "Set up Python for release verification",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Check Python style with hash-pinned Ruff",
          "run": "python -m venv \"$RUNNER_TEMP/style\"\n\"$RUNNER_TEMP/style/bin/python\" -m pip install --quiet --only-binary=:all: --no-deps --require-hashes -r .github/pipeline/shared/requirements-style.txt\n\"$RUNNER_TEMP/style/bin/ruff\" format --check .\n\"$RUNNER_TEMP/style/bin/ruff\" check ."
        },
        {
          "name": "Install hash-locked release coverage tooling",
          "run": "python -m pip install --only-binary=:all: --require-hashes -r .github/pipeline/shared/requirements-coverage.txt"
        },
        {
          "name": "Verify immutable image binding",
          "run": "src=.github/pipeline/shared,.github/pipeline/publish,.github/pipeline/deploy\npython -m coverage erase\nfor step in shared publish deploy; do python -m coverage run --append --source=\"$src\" -m unittest discover -s \".github/pipeline/$step\" -p 'test_*.py' || exit 1; done\npython -m coverage report --include='*/issue_template.py,*/owner_approval.py,*/owner_release.py,*/release_version.py,*/pipeline_tag.py,*/image.py,*/registry.py' --fail-under=85",
          "env": {
            "COVERAGE_FILE": "${{ runner.temp }}/domain-release.coverage"
          }
        },
        {
          "name": "Initialize Java security analysis",
          "uses": "github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "languages": "java-kotlin",
            "build-mode": "manual",
            "queries": "security-extended",
            "tools": "linked"
          }
        },
        {
          "name": "Fetch contracts from Content",
          "run": "./.github/pipeline/build/fetch-contracts.sh",
          "env": {
            "CONTENT_READ_TOKEN": "${{ secrets.CONTENT_READ_TOKEN }}"
          }
        },
        {
          "name": "Start a disposable in-memory DynamoDB Local for the store tests (DLV-970; the one database fixture since the PostgreSQL retirement of 2026-11-17)",
          "run": "docker run -d --rm --name dynamodb-local -p 127.0.0.1:4445:8000 amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1 -jar DynamoDBLocal.jar -inMemory -sharedDb\nfor attempt in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4445/ && exit 0; sleep 1; done\necho 'DynamoDB Local did not answer on 127.0.0.1:4445' >&2; exit 1"
        },
        {
          "name": "Test all production code and require at least 85 percent line coverage",
          "run": "./mvnw --batch-mode --no-transfer-progress -Pcoverage clean verify",
          "env": {
            "DLV970_DYNAMODB_TEST_ENDPOINT": "http://127.0.0.1:4445",
            "DLV970_LOCAL_DYNAMODB_ENDPOINT": "http://127.0.0.1:4445"
          }
        },
        {
          "name": "Analyze Java code without publishing source databases or SARIF",
          "uses": "github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "output": ".codex-scratch/security/codeql",
            "upload": "never",
            "upload-database": false
          }
        },
        {
          "name": "Require completed SAST and no high-severity findings",
          "run": "python3 .github/pipeline/build/check.py sarif"
        },
        {
          "name": "Install checksum-pinned security scanners",
          "run": "python3 .github/pipeline/build/check.py install --tool trivy\npython3 .github/pipeline/build/check.py install --tool gitleaks"
        },
        {
          "name": "Scan all fetched Git history for secrets with redacted output",
          "run": "python3 .github/pipeline/build/check.py history"
        },
        {
          "name": "Resolve direct and transitive dependencies including test/build configurations",
          "run": "python3 .github/pipeline/build/check.py dependencies --build-system maven"
        },
        {
          "name": "Scan resolved dependency inventory",
          "run": "python3 .github/pipeline/build/check.py sbom"
        },
        {
          "name": "Scan Docker configuration and current source for secrets",
          "run": "python3 .github/pipeline/build/check.py config"
        },
        {
          "name": "Build the standalone application image from pinned bases",
          "run": "if [ -z \"$RELEASE_VERSION\" ]; then RELEASE_VERSION=dev; BUILD_VERSION=0.0.1-SNAPSHOT; else BUILD_VERSION=\"${RELEASE_VERSION#v}\"; fi\ndocker build --pull --build-arg \"RELEASE_VERSION=$RELEASE_VERSION\" --build-arg \"BUILD_VERSION=$BUILD_VERSION\" --build-arg \"SOURCE_REVISION=$SOURCE_SHA\" --tag lookahead-domain-api:ci ."
        },
        {
          "name": "Verify the image declares and owns the Fargate /tmp mount",
          "run": "DOMAIN_IMAGE_TEST_IMAGE=lookahead-domain-api:ci python3 -m unittest discover -s .github/pipeline/build -p 'test_image_volumes.py' -v"
        },
        {
          "name": "Scan exact builder base, runtime base and built application image",
          "run": "python3 .github/pipeline/build/check.py images --image lookahead-domain-api:ci"
        },
        {
          "name": "Export the exact scanned release image",
          "if": "inputs.export-image == true",
          "run": "python3 .github/pipeline/shared/image.py export --image lookahead-domain-api:ci --directory \"$RUNNER_TEMP/release-image\""
        },
        {
          "name": "Retain immutable image for the same release run",
          "if": "inputs.export-image == true",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "release-image-${{ inputs.source-sha || github.sha }}",
            "path": "${{ runner.temp }}/release-image/",
            "retention-days": 1,
            "if-no-files-found": "error",
            "compression-level": 0
          }
        }
      ],
      "env": {
        "CODEQL_ACTION_DIFF_INFORMED_QUERIES": "false",
        "CODEQL_ACTION_OVERLAY_ANALYSIS": "false",
        "RELEASE_VERSION": "${{ inputs.release-version }}",
        "SOURCE_SHA": "${{ inputs.source-sha || github.sha }}"
      }
    }
  }
}
