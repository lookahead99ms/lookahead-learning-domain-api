{
  "name": "Domain API CI",
  "run-name": "${{ github.workflow }} | ${{ github.head_ref || github.ref_name }} | ${{ github.event_name }} | #${{ github.run_number }}",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {},
    "workflow_call": {
      "inputs": {
        "export-image": {
          "type": "boolean",
          "default": false
        },
        "release-version": {
          "type": "string",
          "default": ""
        },
        "source-sha": {
          "type": "string",
          "required": false,
          "default": "",
          "description": "Tag-resolved application commit to build; empty builds the triggering commit"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "lookahead-learning-domain-api-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 55,
      "steps": [
        {
          "name": "Checkout the selected source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.source-sha || github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Fetch the executed workflow commit for image binding",
          "if": "inputs.export-image == true",
          "run": "git fetch origin \"$GITHUB_SHA\""
        },
        {
          "name": "Verify release tag before building",
          "if": "inputs.export-image == true",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tools/release/release_version.py check --app domain"
        },
        {
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "name": "Test security gates with clean, finding and incomplete fixtures",
          "run": "python3 -m unittest discover -s tools/security -p 'test_*.py'"
        },
        {
          "name": "Set up Python for release verification",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Install hash-locked release coverage tooling",
          "run": "python -m pip install --only-binary=:all: --require-hashes -r tools/release/requirements-coverage.txt"
        },
        {
          "name": "Verify immutable image binding",
          "run": "python -m coverage run --source=tools/release -m unittest discover -s tools/release -p 'test_*.py'\npython -m coverage report --include='*/issue_template.py,*/owner_approval.py,*/owner_release.py,*/release_version.py,*/pipeline_tag.py,*/image.py,*/registry.py,*/consumer_contract.py' --fail-under=85",
          "env": {
            "COVERAGE_FILE": "${{ runner.temp }}/domain-release.coverage"
          }
        },
        {
          "name": "Initialize Java security analysis",
          "uses": "github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "languages": "java-kotlin",
            "build-mode": "manual",
            "queries": "security-extended",
            "tools": "linked"
          }
        },
        {
          "name": "Prepare disposable database fixture password file",
          "run": "umask 077\nprintf '%s' 'synthetic-disposable-domain-ci' > \"$RUNNER_TEMP/domain-test-password\""
        },
        {
          "name": "Fetch the Gateway consumer contract at its newest release tag",
          "env": {
            "GH_TOKEN": "${{ secrets.CROSS_REPO_READ_TOKEN }}"
          },
          "run": "python3 tools/release/consumer_contract.py fetch --output src/test/resources/contracts/domain-api-v1.json --receipt \"$RUNNER_TEMP/consumer-contract.json\""
        },
        {
          "name": "Test all production code and require at least 85 percent line coverage",
          "run": "./mvnw --batch-mode --no-transfer-progress -Pcoverage clean verify",
          "env": {
            "CLOUD_AUTH_TEST_DATABASE_URL": "jdbc:postgresql://127.0.0.1:4393/lookahead_domain_cloud_auth",
            "CLOUD_AUTH_TEST_PASSWORD_FILE": "${{ runner.temp }}/domain-test-password",
            "DLV921_DATABASE_URL": "jdbc:postgresql://127.0.0.1:4392/lookahead_domain_review",
            "DLV921_DATABASE_PASSWORD_FILE": "${{ runner.temp }}/domain-test-password",
            "DOMAIN_BOOTSTRAP_TEST_URL": "jdbc:postgresql://127.0.0.1:4394/lookahead_platform",
            "DOMAIN_BOOTSTRAP_TEST_PASSWORD_FILE": "${{ runner.temp }}/domain-test-password"
          }
        },
        {
          "name": "Analyze Java code without publishing source databases or SARIF",
          "uses": "github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "output": ".codex-scratch/security/codeql",
            "upload": "never",
            "upload-database": false
          }
        },
        {
          "name": "Require completed SAST and no high-severity findings",
          "run": "python3 tools/security/check.py sarif"
        },
        {
          "name": "Install checksum-pinned security scanners",
          "run": "python3 tools/security/check.py install --tool trivy\npython3 tools/security/check.py install --tool gitleaks"
        },
        {
          "name": "Scan all fetched Git history for secrets with redacted output",
          "run": "python3 tools/security/check.py history"
        },
        {
          "name": "Resolve direct and transitive dependencies including test/build configurations",
          "run": "python3 tools/security/check.py dependencies --build-system maven"
        },
        {
          "name": "Scan resolved dependency inventory",
          "run": "python3 tools/security/check.py sbom"
        },
        {
          "name": "Scan Docker configuration and current source for secrets",
          "run": "python3 tools/security/check.py config"
        },
        {
          "name": "Build the standalone application image from pinned bases",
          "run": "if [ -z \"$RELEASE_VERSION\" ]; then RELEASE_VERSION=dev; BUILD_VERSION=0.0.1-SNAPSHOT; else BUILD_VERSION=\"${RELEASE_VERSION#v}\"; fi\ndocker build --pull --build-arg \"RELEASE_VERSION=$RELEASE_VERSION\" --build-arg \"BUILD_VERSION=$BUILD_VERSION\" --build-arg \"SOURCE_REVISION=$SOURCE_SHA\" --tag lookahead-domain-api:ci ."
        },
        {
          "name": "Verify the image declares and owns the Fargate /tmp mount",
          "run": "DOMAIN_IMAGE_TEST_IMAGE=lookahead-domain-api:ci python3 -m unittest tools.container.test_image_volumes -v"
        },
        {
          "name": "Scan exact builder base, runtime base and built application image",
          "run": "python3 tools/security/check.py images --image lookahead-domain-api:ci"
        },
        {
          "name": "Export the exact scanned release image",
          "if": "inputs.export-image == true",
          "run": "python3 tools/release/image.py export --image lookahead-domain-api:ci --directory \"$RUNNER_TEMP/release-image\""
        },
        {
          "name": "Retain immutable image for the same release run",
          "if": "inputs.export-image == true",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "release-image-${{ inputs.source-sha || github.sha }}",
            "path": "${{ runner.temp }}/release-image/",
            "retention-days": 1,
            "if-no-files-found": "error",
            "compression-level": 0
          }
        }
      ],
      "services": {
        "cloud-auth-db": {
          "image": "postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0",
          "env": {
            "POSTGRES_USER": "postgres",
            "POSTGRES_PASSWORD": "synthetic-disposable-domain-ci",
            "POSTGRES_DB": "lookahead_domain_cloud_auth"
          },
          "ports": [
            "127.0.0.1:4393:5432"
          ],
          "options": "--health-cmd \"pg_isready -U postgres\" --health-interval 5s --health-timeout 5s --health-retries 20"
        },
        "review-plan-db": {
          "image": "postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0",
          "env": {
            "POSTGRES_USER": "postgres",
            "POSTGRES_PASSWORD": "synthetic-disposable-domain-ci",
            "POSTGRES_DB": "lookahead_domain_review"
          },
          "ports": [
            "127.0.0.1:4392:5432"
          ],
          "options": "--health-cmd \"pg_isready -U postgres\" --health-interval 5s --health-timeout 5s --health-retries 20"
        },
        "bootstrap-db": {
          "image": "postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0",
          "env": {
            "POSTGRES_USER": "postgres",
            "POSTGRES_PASSWORD": "synthetic-disposable-domain-ci",
            "POSTGRES_DB": "lookahead_platform"
          },
          "ports": [
            "127.0.0.1:4394:5432"
          ],
          "options": "--health-cmd \"pg_isready -U postgres\" --health-interval 5s --health-timeout 5s --health-retries 20"
        }
      },
      "env": {
        "CODEQL_ACTION_DIFF_INFORMED_QUERIES": "false",
        "CODEQL_ACTION_OVERLAY_ANALYSIS": "false",
        "RELEASE_VERSION": "${{ inputs.release-version }}",
        "SOURCE_SHA": "${{ inputs.source-sha || github.sha }}"
      }
    }
  }
}
